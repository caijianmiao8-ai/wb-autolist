<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 14px;">
<h2 class="sr-only">Mockup of the simplified listing flow with inline Russian video dubbing built into the card media step.</h2>
<style>
  .ls{--pk:#CB11AB;--pk2:#7F3FBF;--ink:#0f172a;--ink2:#334155;--mut:#64748b;--ln:rgba(15,23,42,.10);--ins:#F4F6FA;}
  .ls *{box-sizing:border-box;}
  .ls-prime{color:#fff;background-image:linear-gradient(135deg,var(--pk),var(--pk2));border:none;border-radius:11px;padding:11px 16px;font-size:13px;font-weight:500;cursor:pointer;width:100%;}
  .ls-ghost{border:1px solid var(--ln);background:#fff;border-radius:10px;padding:8px 13px;font-size:12px;color:var(--ink2);cursor:pointer;}
  .ls-in{width:100%;border:1px solid var(--ln);background:#fff;border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--ink);}
  .ls-lbl{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:0 0 5px;}
  .ls-tab{flex:1;border:none;background:transparent;border-radius:7px;padding:7px 4px;font-size:12px;color:var(--mut);cursor:pointer;}
  .ls-tab.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(15,23,42,.08);}
  .ls-chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--ln);color:var(--ink2);background:rgba(15,23,42,.03);}
</style>
<div style="background:#F7F8FB;border:1px solid rgba(15,23,42,.10);border-radius:14px;overflow:hidden;" class="ls">
  <div style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid rgba(15,23,42,.08);background:#fff;">
    <span style="font-size:13px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:5px;"><i class="ti ti-bolt" style="color:var(--pk)"></i> 新建商品卡片</span>
    <span class="ls-chip" style="margin-left:auto;color:#854F0B;background:#FAEEDA;border-color:#FAC775;"><i class="ti ti-flask"></i> 沙盒</span>
  </div>
  <!-- step switcher -->
  <div style="display:flex;gap:4px;background:var(--ins);margin:12px 14px 0;border:1px solid rgba(15,23,42,.08);border-radius:10px;padding:3px;">
    <button class="ls-tab on" data-s="0" onclick="lsGo(0)">1 · 输入</button>
    <button class="ls-tab" data-s="1" onclick="lsGo(1)">2 · 预览(图文+视频)</button>
    <button class="ls-tab" data-s="2" onclick="lsGo(2)">3 · 发布</button>
  </div>
  <div id="ls-body" style="padding:14px;min-height:330px;"></div>
</div>
</div>
<script>
(function(){
  var pk='#CB11AB';
  var dubState=0; // 0 英文 1 配音中 2 俄配完成
  function videoSlot(){
    if(dubState===0){
      return '<div style="border:1px solid rgba(15,23,42,.10);border-radius:10px;overflow:hidden;">'
        +'<div style="height:74px;background:#1e3a5f;display:flex;align-items:center;justify-content:center;position:relative;"><i class="ti ti-player-play" style="color:#fff;font-size:24px;opacity:.85;"></i>'
        +'<span style="position:absolute;top:6px;left:6px;font-size:9.5px;background:rgba(0,0,0,.5);color:#fff;border-radius:5px;padding:1px 6px;">英文 · 0:08</span></div>'
        +'<button onclick="lsDub(1)" style="width:100%;border:none;border-top:1px solid rgba(15,23,42,.08);background:#FBEAF0;color:#993556;font-size:11.5px;font-weight:500;padding:8px;cursor:pointer;"><i class="ti ti-language"></i> 配成俄语</button></div>';
    }
    if(dubState===1){
      return '<div style="border:1px solid rgba(203,17,171,.3);border-radius:10px;overflow:hidden;">'
        +'<div style="height:74px;background:#1e3a5f;display:flex;align-items:center;justify-content:center;"><i class="ti ti-loader-2" style="color:#fff;font-size:22px;animation:lsspin 1s linear infinite;"></i></div>'
        +'<div style="font-size:10.5px;color:#993556;background:#FBEAF0;padding:7px 8px;text-align:center;">配音中… 识别→翻译→克隆音色→合成 · ~40s</div></div>'
        +'<style>@keyframes lsspin{to{transform:rotate(360deg)}}</style>';
    }
    return '<div style="border:1px solid #9FE1CB;border-radius:10px;overflow:hidden;">'
      +'<div style="height:74px;background:#1e3a5f;display:flex;align-items:center;justify-content:center;position:relative;"><i class="ti ti-player-play" style="color:#fff;font-size:24px;opacity:.85;"></i>'
      +'<span style="position:absolute;top:6px;left:6px;font-size:9.5px;background:#0F6E56;color:#fff;border-radius:5px;padding:1px 6px;">俄语 ✓</span></div>'
      +'<div style="font-size:10.5px;color:#0F6E56;background:#E1F5EE;padding:7px 8px;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px;"><i class="ti ti-circle-check"></i> 已配俄语 · 随卡片一起上架 <span onclick="lsDub(0)" style="margin-left:6px;color:#64748b;cursor:pointer;text-decoration:underline;">重配</span></div></div>';
  }
  var bodies=function(){return [
    // step 0 input
    '<div style="max-width:520px;margin:0 auto;">'
      +'<p class="ls-lbl">商品名 *</p><input class="ls-in" placeholder="如:无线蓝牙耳机" style="margin-bottom:12px;"/>'
      +'<p class="ls-lbl">关键词(俄语搜索词,逗号分隔)</p><input class="ls-in" placeholder="наушники, bluetooth" style="margin-bottom:12px;"/>'
      +'<p class="ls-lbl">售价(到手价 ₽)</p><input class="ls-in" value="1990" style="margin-bottom:12px;"/>'
      +'<p class="ls-lbl">真实产品图 / 视频(可选)</p>'
      +'<div style="border:1px dashed rgba(15,23,42,.20);border-radius:11px;padding:18px;text-align:center;color:#64748b;background:#F4F6FA;margin-bottom:14px;"><i class="ti ti-upload" style="font-size:20px;"></i><div style="font-size:12px;margin-top:5px;">拖入图片或英文视频 · 没有就留空,AI 全自动生成</div></div>'
      +'<button class="ls-prime"><i class="ti ti-sparkles"></i> 一键生成</button>'
      +'<div style="font-size:10.5px;color:#94a3b8;text-align:center;margin-top:9px;">类目、俄语文案、配图自动生成 · 包裹尺寸套用你的默认 · 这一步只填这些</div>'
    +'</div>',
    // step 1 preview
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">'
      +'<div>'
        +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;"><span class="ls-lbl" style="margin:0;">文案 · 可改</span><span class="ls-chip" style="margin-left:auto;color:#534AB7;background:#EEEDFE;border-color:#CECBF6;">类目:Наушники ✎</span></div>'
        +'<div style="border:1px solid rgba(15,23,42,.10);border-radius:10px;padding:10px;font-size:12px;color:#0f172a;background:#fff;line-height:1.55;">'
          +'<div style="font-weight:500;">Беспроводные наушники Pro — глубокий бас</div>'
          +'<div style="color:#64748b;font-size:11px;margin-top:6px;">Кристально чистый звук, 30 часов работы, быстрая зарядка…</div>'
          +'<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;"><span class="ls-chip">30 ч работы</span><span class="ls-chip">IPX5</span><span class="ls-chip">Bluetooth 5.3</span></div>'
        +'</div>'
      +'</div>'
      +'<div>'
        +'<span class="ls-lbl">媒体 · 图片 + 视频</span>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:0 0 8px;">'
          +'<div style="aspect-ratio:1;border-radius:8px;background:#EEEDFE;display:flex;align-items:center;justify-content:center;color:#7F3FBF;"><i class="ti ti-photo"></i></div>'
          +'<div style="aspect-ratio:1;border-radius:8px;background:#FBEAF0;display:flex;align-items:center;justify-content:center;color:#CB11AB;"><i class="ti ti-photo"></i></div>'
          +'<div style="aspect-ratio:1;border-radius:8px;background:#E1F5EE;display:flex;align-items:center;justify-content:center;color:#0F6E56;"><i class="ti ti-photo"></i></div>'
        +'</div>'
        +'<div id="ls-vid">'+videoSlot()+'</div>'
      +'</div>'
    +'</div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;"><button class="ls-ghost"><i class="ti ti-refresh"></i> 重新生成</button><button class="ls-prime" style="width:auto;" onclick="lsGo(2)">下一步:发布 →</button></div>',
    // step 2 publish
    '<div style="max-width:520px;margin:0 auto;">'
      +'<div style="background:#fff;border:1px solid rgba(15,23,42,.10);border-radius:11px;padding:4px 14px;">'
        +row('售价(到手价)','1990 ₽','<span style=\'color:#64748b;font-size:11px;cursor:pointer\'>加折扣 ✎</span>')
        +row('库存数量','120 件','')
        +row('发货仓库','Коледино (默认)','')
        +row('包裹尺寸/重量','20×15×5 cm · 0.3 kg(默认)','<span style=\'color:#64748b;font-size:11px;cursor:pointer\'>展开改 ✎</span>')
        +row('媒体','3 图 + 1 俄语视频','<span style=\'color:#0F6E56;font-size:11px\'>✓ 含俄配</span>')
        +row('上架到','沙盒测试店铺','',true)
      +'</div>'
      +'<button class="ls-prime" style="margin-top:14px;"><i class="ti ti-rocket"></i> 确认上架到 Wildberries</button>'
      +'<div style="font-size:10.5px;color:#94a3b8;text-align:center;margin-top:9px;">点击会真实建卡 + 传图/视频 + 定价。约 1–2 分钟。</div>'
    +'</div>'
  ];};
  function row(k,v,extra,last){
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;'+(last?'':'border-bottom:1px solid rgba(15,23,42,.06);')+'">'
      +'<span style="font-size:12px;color:#64748b;">'+k+'</span>'
      +'<span style="font-size:12.5px;color:#0f172a;display:flex;align-items:center;gap:8px;">'+v+' '+(extra||'')+'</span></div>';
  }
  window.lsGo=function(s){
    document.querySelectorAll('.ls-tab').forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-s')===s);});
    document.getElementById('ls-body').innerHTML=bodies()[s];
  };
  window.lsDub=function(st){
    dubState=st; var v=document.getElementById('ls-vid'); if(v) v.innerHTML=videoSlot();
    if(st===1){ setTimeout(function(){ dubState=2; var v2=document.getElementById('ls-vid'); if(v2) v2.innerHTML=videoSlot(); },1600); }
  };
  lsGo(0);
})();
</script>
