name: Build desktop apps

# Builds the Tauri desktop installers on native runners.
#   macOS  → .dmg (Apple Silicon, arm64)
#   Windows → .exe (NSIS) + .msi
# Trigger: push a tag like v1.0.0, or run manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# tauri-action creates a GitHub Release on tag builds — needs write access.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos
          - platform: windows-latest
            target: ""
            name: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # Bundle the video-dubbing runtime so it works out-of-the-box on the
      # customer's machine: node + ffmpeg + ffprobe + uv/uvx land in
      # src-tauri/binaries/ and are copied into the app via tauri.conf resources
      # (-> Resources/bin). Demucs/torch are still downloaded on first dub (heavy),
      # gated behind the in-app "高质量" preset. macOS falls back to ~/.local.
      - name: Fetch dub runtime (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Invoke-WebRequest https://nodejs.org/dist/v22.11.0/win-x64/node.exe -OutFile src-tauri/binaries/node.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx
          Copy-Item (Get-ChildItem ffx -Recurse -Filter ffmpeg.exe)[0].FullName  src-tauri/binaries/ffmpeg.exe
          Copy-Item (Get-ChildItem ffx -Recurse -Filter ffprobe.exe)[0].FullName src-tauri/binaries/ffprobe.exe
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/download/0.11.8/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip
          Expand-Archive uv.zip -DestinationPath uvx
          Copy-Item uvx/uv.exe  src-tauri/binaries/uv.exe
          Copy-Item uvx/uvx.exe src-tauri/binaries/uvx.exe
          Get-ChildItem src-tauri/binaries

      - name: Dub runtime placeholder (macOS)
        if: matrix.name == 'macos'
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/.keep

      # tauri-action runs the tauri.conf beforeBuildCommand (npm run fe:build),
      # compiles the Rust binary, and bundles the platform installer.
      # On a tag push it also creates/updates a GitHub Release and attaches the
      # installers — a real download page (no GitHub login / artifact expiry,
      # unlike upload-artifact). On manual runs (no tag) it just builds.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — tauri-action signs the bundles + emits latest.json so
          # the in-app one-click updater can verify and install new releases.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: WB AutoList ${{ github.ref_name }}
          releaseBody: |
            未签名安装包 — 首次打开会被系统拦截，请按安装指引放行：
            https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/INSTALL.md

            - Windows: SmartScreen 弹窗 → 更多信息 → 仍要运行
            - macOS: 右键 → 打开（或 系统设置 → 隐私与安全性 → 仍要打开）
          releaseDraft: false
          prerelease: false

      # Keep artifacts for MANUAL/dev builds only — tag builds already attach the
      # installers to the GitHub Release (the real download page). Skipping on tags
      # avoids the artifact-storage quota failing an otherwise-successful release
      # build; continue-on-error keeps a quota hit from failing manual runs too.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        continue-on-error: true
        with:
          name: wb-autolist-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error
